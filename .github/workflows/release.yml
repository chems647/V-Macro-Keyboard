name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test .\tests\MacroFenetre.Tests\MacroFenetre.Tests.csproj --configuration Release

      - name: Publish application
        shell: pwsh
        run: >
          dotnet publish .\MacroFenetre.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\dist
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" ".\installer\VMacroKeyboard.iss"
          Compress-Archive `
            -Path ".\dist\VMacroKeyboard.exe", ".\README.md" `
            -DestinationPath ".\dist\VMacroKeyboard-Portable-$version.zip"

          $assets = @(
            ".\dist\VMacroKeyboard-Setup-$version.exe",
            ".\dist\VMacroKeyboard-Portable-$version.zip"
          )
          $checksums = foreach ($asset in $assets) {
            $hash = Get-FileHash -Algorithm SHA256 $asset
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($asset))"
          }
          $checksums | Set-Content -Encoding ascii ".\dist\SHA256SUMS.txt"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          gh release create $env:GITHUB_REF_NAME `
            ".\dist\VMacroKeyboard-Setup-$version.exe" `
            ".\dist\VMacroKeyboard-Portable-$version.zip" `
            ".\dist\SHA256SUMS.txt" `
            --title "V Macro Keyboard $version" `
            --generate-notes
